<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="One pattern, three products: the model interprets, a validated contract crosses the trust boundary, and deterministic code decides.">
  <title>One pattern, three products &#8212; model interprets, code decides</title>
  <defs>
    <clipPath id="p"><rect x="0.5" y="0.5" width="1199" height="539" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#p)">
    <rect width="1200" height="540" fill="#08090B"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      <text x="41" y="58" font-size="15" letter-spacing="3" fill="#2DD4BF">ONE PATTERN, THREE PRODUCTS</text>

      <g font-size="14" letter-spacing="2.2" fill="#5B6572">
        <text x="41" y="104">SOURCE</text>
        <text x="327" y="104">MODEL INTERPRETS</text>
        <text x="613" y="104">VALIDATED CONTRACT</text>
        <text x="899" y="104">CODE DECIDES</text>
      </g>

      <line x1="600" y1="88" x2="600" y2="448" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="3 5"/>
      <rect x="586" y="196" width="28" height="144" fill="#08090B"/>
      <text transform="translate(604 268) rotate(-90)" text-anchor="middle" font-size="12" letter-spacing="2.2" fill="#2DD4BF" fill-opacity="0.9">TRUST BOUNDARY</text>

      <g stroke="#4A545F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M308 168 l6 6 l-6 6"/><path d="M880 168 l6 6 l-6 6"/>
        <path d="M308 280 l6 6 l-6 6"/><path d="M880 280 l6 6 l-6 6"/>
        <path d="M308 392 l6 6 l-6 6"/><path d="M880 392 l6 6 l-6 6"/>
      </g>

      <g fill="#0E1013" stroke="#FFFFFF" stroke-opacity="0.10">
        <rect x="41" y="124" width="260" height="100" rx="10"/><rect x="327" y="124" width="260" height="100" rx="10"/>
        <rect x="613" y="124" width="260" height="100" rx="10"/><rect x="899" y="124" width="260" height="100" rx="10"/>
        <rect x="41" y="236" width="260" height="100" rx="10"/><rect x="327" y="236" width="260" height="100" rx="10"/>
        <rect x="613" y="236" width="260" height="100" rx="10"/><rect x="899" y="236" width="260" height="100" rx="10"/>
        <rect x="41" y="348" width="260" height="100" rx="10"/><rect x="327" y="348" width="260" height="100" rx="10"/>
        <rect x="613" y="348" width="260" height="100" rx="10"/><rect x="899" y="348" width="260" height="100" rx="10"/>
      </g>

      <g font-size="13" letter-spacing="1.8" fill="#2DD4BF">
        <text x="57" y="152">RAZORFLOW</text>
        <text x="57" y="264">DOCNA</text>
        <text x="57" y="376">BLUEPRINT</text>
      </g>

      <g font-size="17" fill="#C3CBD3">
        <text x="57" y="184">buyer intent in</text><text x="57" y="208">plain language</text>
        <text x="343" y="184">Gemini extracts a</text><text x="343" y="208">structured intent</text>
        <text x="629" y="184">category &#183; budget &#183;</text><text x="629" y="208">exclusions &#183; mode</text>
        <text x="915" y="184">catalog engine ranks,</text><text x="915" y="208">policy caps the offer</text>

        <text x="57" y="296">questions and blanks</text><text x="57" y="320">found in a .docx</text>
        <text x="343" y="296">AI writes the</text><text x="343" y="320">answer text only</text>
        <text x="629" y="296">typed PlacementOp</text><text x="629" y="320">values</text>
        <text x="915" y="296">OOXML adapter edits a</text><text x="915" y="320">copy, not the original</text>

        <text x="57" y="408">a one-line</text><text x="57" y="432">product idea</text>
        <text x="343" y="408">model returns a</text><text x="343" y="432">structured plan</text>
        <text x="629" y="408">Zod Blueprint</text><text x="629" y="432">schema</text>
        <text x="915" y="408">Mermaid diagram built</text><text x="915" y="432">from the plan data</text>
      </g>

      <text x="41" y="498" font-size="15" fill="#79838E">Left of the line is interpretation. Right of it is deterministic, reviewable, and testable.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="539" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
