<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Sai Vidyut C. The model interprets. The code decides. Five products built since March 2026: Clip Management System, SatQuery AI, RazorFlow, DocNA, BluePrint.">
  <title>Sai Vidyut C &#8212; The model interprets. The code decides.</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.055"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="0.5" y="0.5" width="1199" height="419" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="420" fill="#08090B"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <ellipse cx="120" cy="20" rx="540" ry="290" fill="url(#glow)"/>
    <rect x="-340" y="0" width="340" height="420" fill="url(#sweep)">
      <animate attributeName="x" values="-340;1200" dur="11s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      <text x="64" y="66" font-size="16" letter-spacing="3.2" fill="#2DD4BF" fill-opacity="0.9">github.com/Sai-Vidyut</text>
      <text x="1136" y="66" text-anchor="end" font-size="14" letter-spacing="2.4" fill="#79838E">FIVE PRODUCTS · SINCE MARCH 2026</text>
    </g>

    <text x="64" y="180" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="76" font-weight="600" letter-spacing="-1.8" fill="#F4F7F9">Sai Vidyut C</text>

    <rect x="66" y="208" width="320" height="1.8" fill="url(#rule)"/>

    <text x="64" y="258" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="400" fill="#AEB8C2">The model interprets.
      <tspan fill="#F4F7F9" font-weight="500"> The code decides.</tspan>
    </text>
    <rect x="640" y="236" width="10" height="26" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      <text x="64" y="312" font-size="14" letter-spacing="2.8" fill="#5B6572">SELECTED WORK</text>
      <rect x="64" y="328" width="1072" height="1" fill="#FFFFFF" fill-opacity="0.10"/>

      <g fill="#2DD4BF">
        <rect x="64" y="340" width="26" height="2"/>
        <rect x="340" y="340" width="26" height="2" fill-opacity="0.75"/>
        <rect x="616" y="340" width="26" height="2" fill-opacity="0.55"/>
        <rect x="892" y="340" width="26" height="2" fill-opacity="0.4"/>
      </g>
      <g font-size="19" fill="#E9EFF4">
        <text x="64" y="372">SatQuery AI</text>
        <text x="340" y="372">RazorFlow</text>
        <text x="616" y="372">DocNA</text>
        <text x="892" y="372">BluePrint</text>
      </g>
      <g font-size="15" fill="#79838E">
        <text x="64" y="398">satellite imagery, questioned</text>
        <text x="340" y="398">agentic commerce, governed</text>
        <text x="616" y="398">documents answered in place</text>
        <text x="892" y="398">idea to implementation plan</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
